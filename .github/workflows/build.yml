name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.configuration }}|Win32
        run: msbuild BorderlessMode.sln /t:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform=Win32 /warnaserror
